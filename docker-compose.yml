version: '3.8'

services:
  # 1. MongoDB Database (MERN Stack)
  mongodb:
    image: mongo:7.0
    container_name: securevault_mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - securevault_net

  # 2. Redis Cache & Temporary Session/Token Store
  redis:
    image: redis:7-alpine
    container_name: securevault_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securevault_net

  # 3. Express.js REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securevault_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/securevault
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-securevault_super_secret_session_key_32_bytes}
      JWT_SECRET: ${JWT_SECRET:-securevault_jwt_signature_secret_32_bytes_long}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      FRONTEND_URL: http://localhost:3000
      ENABLE_EMAIL_SIMULATION: "true"
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      redis:
        condition: service_healthy
    networks:
      - securevault_net

  # 4. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securevault_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - securevault_net

volumes:
  mongo_data:
  redis_data:

networks:
  securevault_net:
    driver: bridge
